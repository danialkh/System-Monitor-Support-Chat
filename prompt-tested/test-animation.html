!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>3 CSS Animations</title> <style> /* Base setup for previewing */ body { background-color: #0f172a; color: #ffffff; font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; gap: 60px; } /* ========================================== ANIMATION 1: Glowing Pulse Button ========================================== */ .pulse-button { padding: 16px 32px; font-size: 1rem; font-weight: 600; color: #ffffff; background: linear-gradient(135deg, #6366f1, #a855f7); border: none; border-radius: 50px; cursor: pointer; outline: none; box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.7); animation: pulse-glow 2s infinite; transition: transform 0.2s ease; } .pulse-button:hover { transform: scale(1.05); } @keyframes pulse-glow { 0% { transform: scale(0.98); box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(168, 85, 247, 0); } 100% { transform: scale(0.98); box-shadow: 0 0 0 0 rgba(168, 85, 247, 0); } } /* ========================================== ANIMATION 2: Dual-Ring Loading Spinner ========================================== */ .spinner-container { position: relative; width: 80px; height: 80px; } .spinner { box-sizing: border-box; position: absolute; width: 100%; height: 100%; border: 8px solid transparent; border-top-color: #38bdf8; border-radius: 50%; animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite; } .spinner:nth-child(2) { border-top-color: #f43f5e; animation-delay: -0.4s; } @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } } /* ========================================== ANIMATION 3: Floating Interactive Card ========================================== */ .floating-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px; width: 260px; text-align: center; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); animation: float 4s ease-in-out infinite; } .floating-card h3 { margin: 0 0 8px 0; color: #38bdf8; } .floating-card p { margin: 0; color: #94a3b8; font-size: 0.9rem; } @keyframes float { 0% { transform: translateY(0px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); } 50% { transform: translateY(-15px); box-shadow: 0 25px 35px -5px rgba(0, 0, 0, 0.5); } 100% { transform: translateY(0px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); } } </style> </head> <body> <!-- Animation 1: Pulse Button --> <button class="pulse-button">Hover & Glow</button> <!-- Animation 2: Dual Spinner --> <div class="spinner-container"> <div class="spinner"></div> <div class="spinner"></div> </div> <!-- Animation 3: Floating Card --> <div class="floating-card"> <h3>Floating Card</h3> <p>Smooth Y-axis ambient hover animation using CSS keyframes.</p> </div> </body>
